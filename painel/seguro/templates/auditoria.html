{% extends "base.html" %}{% block titulo %}Auditoria{% endblock %}
{% block conteudo %}
<h1>Trilha de auditoria</h1>
<table><tr><th scope="col">Quando</th><th scope="col">Usuário</th><th scope="col">Ação</th><th scope="col">Detalhe</th><th scope="col">IP (túnel)</th></tr>
{% for l in linhas %}<tr><td>{{ l.ts.strftime('%d/%m %H:%M:%S') }}</td><td>{{ l.usuario }}</td><td>{{ l.acao }}</td><td>{{ l.detalhe }}</td><td>{{ l.ip }}</td></tr>{% endfor %}
</table>
{% endblock %}
