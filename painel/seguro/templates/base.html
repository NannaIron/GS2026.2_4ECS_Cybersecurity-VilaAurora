<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Painel{% endblock %} · Rede Vila Aurora</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header>
  <strong>Rede Comunitária Vila Aurora</strong> — painel de supervisão
  {% if usuario %}
  <nav aria-label="Menu principal"><ul>
    <li><a href="{{ url_for('inicio') }}">Início</a></li>
    <li><a href="{{ url_for('agendamento') }}">Bomba d'água</a></li>
    <li><a href="{{ url_for('comandos') }}">Comandos e aprovações</a></li>
    {% if perfil in ('coordenacao','auditor') %}<li><a href="{{ url_for('acessos') }}">Histórico de acessos</a></li>
    <li><a href="{{ url_for('auditoria') }}">Auditoria</a></li>{% endif %}
    <li><form method="post" action="{{ url_for('sair') }}" style="display:inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" style="margin:0">Sair ({{ usuario }} · {{ NOME_PERFIL.get(perfil, perfil) }})</button></form></li>
  </ul></nav>
  {% endif %}
</header>
<main id="conteudo" tabindex="-1">
{% block conteudo %}{% endblock %}
</main>
</body>
</html>
