# Broker MQTT LOCAL do nó de borda (RT-02, RT-04)
# Só aceita clientes com certificado X.509 emitido pela CA da Vila Aurora (mTLS).
per_listener_settings false
allow_anonymous false

listener 8883
protocol mqtt
cafile /pki/ca.crt
certfile /pki/broker.crt
keyfile /pki/broker.key
crlfile /pki/crl.pem
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

# Autorização por identidade (CN) - menor privilégio por tópico
acl_file /pki/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z
